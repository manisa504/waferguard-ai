name: Publish project and campaign pages
on:
  push:
    branches: [main]
    paths:
      - 'DOC/**'
      - 'reports/**'
      - 'scripts/build_campaign.py'
      - 'scripts/build_public_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Render portable campaign brief
        run: |
          python3 scripts/build_campaign.py
          git diff --exit-code -- DOC/CAMPAIGN_BRIEF.md
      - name: Package only public pages and evidence
        run: python3 scripts/build_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .public-site
      - name: Publish static portfolio pages
        id: deployment
        uses: actions/deploy-pages@v4
